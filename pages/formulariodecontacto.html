<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario de contacto</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <header>
            <h1>Formulario de contacto</h1>
            <p>Facilito este formulario para pedir opinión a los lectores, ya sea sobre el ranking o sobre como
                esta diseñada la página, etc.
            </p>
        </header>
        <nav>
            <a href="../index.html">Inicio</a> |
            <a href="juegos.html">Videojuegos</a> |
            <a href="favoritos.html">Mi ranking</a> |
            <a href="generos.html">Géneros</a> |
            <a href="precio.html">Precio</a> 
        </nav>
        <br><hr>
        <main>
            <label for="nombre">
                Nombre: <input type="text" id="nombre" name="nombre" required>
            </label>
            <br><br>
            <label for="apellidos">
                Apellidos: <input type="text" id="apellidos" name="apellidos" required>
            </label>
            <br><br>
            <label for="email">
                Email: <input type="email" id="email" name="email" required>
            </label>
            <br><br>
            <label for="telefono">
                Teléfono: <input type="tel" id="tel" name="telefono" required>
            </label>
            <br><br>
            <label for="edad">
                Edad: <input type="number" id="number" name="number" required>
            </label>
            <br><br>
            <label for="Recomendación">Recomendación:</label>
            <select id="recomendar" name="recomendar" required>
                <option value="juego">Escoge algún juego</option>
                <option value="juego">Roblox</option>
                <option value="juego">GTA</option>
                <option value="juego">Rocket League</option>
                <option value="juego">League of Legends</option>
                <option value="juego">Valorant</option>
                <option value="juego" type="text">Otro</option>
            </select>
            <br><br>
            <label for="añade">
                Si has elegido "otro" añade el juego que creas que falte: <input type="text" id="add" name="add">
            </label>
            <br><br>
            <table>
                <tr>
                    <td valign="top">
                        <label for="Algo">Algo a mejorar del ranking:</label>
                    </td>
                    <td>
                        <textarea name="Algo" rows="6" cols="50"></textarea>
                    </td>

                </tr>

            </table>
            <br>
            <button type="submit">Enviar mensaje</button>
        </main>
        <footer>
            <img src = "../ImagenesProyecto/Logotipo-CEAC.png" alt = "logo" width = "200" height = "120" align = "left">
            <div class="datos-footer">
                <p>Sergio Molina Gil</p>
                <p>CFGS - 1º DAM</p>
                <p>Lenguaje de marcas</p>
            </div>
        </footer>
    </body>
</html>
